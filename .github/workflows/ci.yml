name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    # Retain the real legacy checks and the existing branch-protection contexts.
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Legacy format check
        run: cargo fmt --check
      - name: Legacy cargo check
        run: cargo check --locked
      - name: Legacy clippy
        run: cargo clippy --locked -- -D warnings
      - name: Legacy tests
        run: cargo test --locked
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install without scripts or network dependencies
        run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: Agent-native runtime and package tests
        run: npm test
      - name: Verify installed package
        run: npm run verify:package
  node24:
    name: Node 24 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - run: npm test
      - run: npm run verify:package
