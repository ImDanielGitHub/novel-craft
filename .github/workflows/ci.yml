name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Prepare npm smoke binary
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          mkdir -p npm/bin
          cp "target/release/novel-craft${ext}" "npm/bin/novel-craft-${triple}${ext}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: npm wrapper tests
        run: npm run test:wrapper

      - name: npm wrapper smoke
        run: node npm/bin/novel-craft.js --version

      - name: npm package contract
        run: npm run verify:package:release
