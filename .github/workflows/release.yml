name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-craft-npm-publish
  cancel-in-progress: false

jobs:
  prepare-version-tag:
    name: Tag verified main commit for protected release
    if: >-
      github.repository == 'ImDanielGitHub/novel-craft' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the exact CI-tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create immutable version tag and dispatch protected release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const sha=process.env.TESTED_COMMIT;
          const repo=process.env.GITHUB_REPOSITORY;
          if(p.name!=='novel-craft' || !/^\d+\.\d+\.\d+$/.test(p.version) || !/^[a-f0-9]{40}$/.test(sha) || repo!=='ImDanielGitHub/novel-craft') throw new Error('Unexpected release identity.');
          const registry=await fetch(`https://registry.npmjs.org/novel-craft/${p.version}`,{signal:AbortSignal.timeout(30000),cache:'no-store'});
          if(registry.status===200) { console.log(`novel-craft@${p.version} is already published; no new tag or deployment requested.`); process.exit(0); }
          if(registry.status!==404) throw new Error(`Registry unavailable: ${registry.status}`);
          async function api(endpoint,method='GET',body) {
            const r=await fetch(`https://api.github.com/repos/${repo}/${endpoint}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});
            const data=r.status===204?null:await r.json();
            if(!r.ok && r.status!==404) throw new Error(`GitHub ${method} ${endpoint}: ${r.status} ${data?.message??''}`);
            return {status:r.status,data};
          }
          const tag=`v${p.version}`;
          const existing=await api(`git/ref/tags/${tag}`);
          if(existing.status===404) {
            const created=await api('git/refs','POST',{ref:`refs/tags/${tag}`,sha});
            if(created.status!==201)throw new Error('Version tag could not be created.');
          } else if(existing.data.object.type!=='commit' || existing.data.object.sha!==sha) {
            throw new Error('Version tag already points elsewhere; refusing to move it.');
          }
          // GITHUB_TOKEN-created tags do not trigger push workflows. Dispatch explicitly
          // at the same immutable tag; the npm environment still enforces its own rules.
          const dispatched=await api('actions/workflows/release.yml/dispatches','POST',{ref:tag});
          if(dispatched.status!==204)throw new Error('Tagged release dispatch failed.');
          console.log(`Dispatched release.yml at ${tag}, verified commit ${sha}. Environment protection is unchanged.`);
          NODE
  publish-npm:
    name: Verify and publish npm package
    if: >-
      github.repository == 'ImDanielGitHub/novel-craft' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11
      - name: Install
        run: npm ci --ignore-scripts --offline --no-audit --no-fund
      - name: Test runtime and installed tarball
        run: npm test
      - name: Verify distribution
        run: npm run verify:package
      - name: Pack exact release artefact
        id: package
        shell: bash
        run: |
          npm pack --ignore-scripts --json > package-info.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const packed=JSON.parse(fs.readFileSync('package-info.json','utf8'))[0];
          if(!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error('Stable semantic version required.');
          if(process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF!==`refs/tags/v${p.version}`) throw new Error('Tag and package version differ.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${p.version}\narchive=${packed.filename}\nintegrity=${packed.integrity}\n`);
          NODE
      - name: Preserve installable artefact even if publication fails
        uses: actions/upload-artifact@v6
        with:
          name: novel-craft-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
      - name: Check whether this version is already published
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch(`https://registry.npmjs.org/novel-craft/${process.env.RELEASE_VERSION}`,{signal:AbortSignal.timeout(30000),cache:'no-store'});
          if(response.status!==200 && response.status!==404) throw new Error(`Registry unavailable: ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`exists=${response.status===200}\n`);
          NODE
      - name: Publish with the existing trusted publisher identity
        if: steps.registry.outputs.exists == 'false'
        env:
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$RELEASE_ARCHIVE" --provenance --access public --ignore-scripts
      - name: Verify published integrity and clean registry install
        if: steps.registry.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch(`https://registry.npmjs.org/novel-craft/${process.env.RELEASE_VERSION}`,{signal:AbortSignal.timeout(30000),cache:'no-store'});
          if(!response.ok)throw new Error(`Registry readback failed: ${response.status}`);
          const data=await response.json();
          if(data.dist?.integrity!==process.env.RELEASE_INTEGRITY)throw new Error('Published integrity differs from tested tarball.');
          console.log(`Verified registry integrity for novel-craft@${data.version}`);
          NODE
          prefix="$RUNNER_TEMP/novel-craft-registry-smoke"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "novel-craft@$RELEASE_VERSION"
          node "$prefix/node_modules/novel-craft/cli/index.mjs" --version
          node "$prefix/node_modules/novel-craft/cli/index.mjs" genres coverage --json
      - name: Create GitHub release from the published artefact
        if: steps.registry.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "v$RELEASE_VERSION" "$RELEASE_ARCHIVE" \
            --target "$RELEASE_COMMIT" --title "Novel Craft $RELEASE_VERSION" \
            --generate-notes --notes "Agent-native webnovel creation and revision, source-grounded canon, recoverable proposals, broad category guidance, and a dependency-free Node CLI. Real-model quality remains a separate evaluation."
