name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    name: Build release binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

      - name: Package binary
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          mkdir -p dist npm/bin
          cp "target/release/novel-craft${ext}" "npm/bin/novel-craft-${triple}${ext}"
          cp "target/release/novel-craft${ext}" "dist/novel-craft-${triple}${ext}"
          artifact="dist/novel-craft-${triple}${ext}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$artifact" > "$artifact.sha256"
          else
            sha256sum "$artifact" > "$artifact.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*
            npm/bin/novel-craft-*

  publish-npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect npm binaries
        shell: bash
        run: |
          mkdir -p npm/bin
          find artifacts -type f -name 'novel-craft-*' ! -name '*.sha256' -exec cp {} npm/bin/ \;
          find npm/bin -type f -name 'novel-craft-*' ! -name '*.exe' -exec chmod 755 {} \;

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: npm wrapper tests
        run: npm run test:wrapper

      - name: Smoke npm wrapper
        run: node npm/bin/novel-craft.js --version

      - name: Verify npm package contract
        run: npm run verify:package:release

      - name: Verify npm trusted publishing runtime
        run: |
          node --version
          npm --version
          npx --yes npm@latest --version
          npx --yes npm@latest trust github novel-craft \
            --repo ImDanielGitHub/novel-craft \
            --file release.yml \
            --env npm \
            --allow-publish \
            --dry-run \
            --json

      - name: Publish to npm with provenance
        run: npx --yes npm@latest publish --provenance --access public

  prepare-release:
    name: Prepare signed release assets
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -path '*/dist/*' -exec cp {} release/ \;

      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release/novel-craft-*

      - name: Download offline attestation bundles
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release/attestations
          for artifact in release/novel-craft-*; do
            case "$artifact" in
              *.sha256) continue ;;
            esac
            gh attestation download "$artifact" -R "$GITHUB_REPOSITORY"
          done
          find . -maxdepth 1 -type f -name 'sha256*.jsonl' -exec mv {} release/attestations/ \;

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-release-assets
          path: release/

  github-release:
    name: Create GitHub Release
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download prepared release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: github-release-assets
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release -type f -print | sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag
