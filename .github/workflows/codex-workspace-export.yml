name: Codex Workspace Export

on:
  push:
    branches:
      - codex/novel-craft-200-modernisation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export source workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Refresh advisory-affected dependencies
        shell: bash
        run: |
          cargo update -p anyhow --precise 1.0.103
          cargo update -p crossbeam-epoch --precise 0.9.20

      - name: Archive source workspace
        shell: bash
        run: |
          tar --exclude=.git --exclude=target -czf /tmp/novel-craft-workspace.tar.gz .
          cp Cargo.lock /tmp/Cargo.lock

      - name: Upload workspace
        uses: actions/upload-artifact@v6
        with:
          name: codex-workspace
          path: |
            /tmp/novel-craft-workspace.tar.gz
            /tmp/Cargo.lock
          if-no-files-found: error
